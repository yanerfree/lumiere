[project]
name = "testbench-backend"
version = "0.1.0"
description = "测试管理平台后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "joserfc>=1.0",
    "bcrypt>=4.0,<4.1",
    "arq>=0.26",
    "redis>=5.0",
    "httpx[http2]>=0.27",
    "tenacity>=8.2",
    "openpyxl>=3.1",
    "pypinyin>=0.53",   # 用例编号模块段取中文拼音首字母
    "jinja2>=3.1",
    "filelock>=3.13",
    "fastmcp>=3.4",
    "pytest-playwright>=0.5",
    "playwright>=1.40",
    "grpcio>=1.60",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx",
    "factory-boy>=3.3",
    "faker>=28.0",
]

# pytest 和 coverage 配置已移至项目根目录 pyproject.toml
